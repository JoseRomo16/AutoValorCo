---
name: autovalor

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: autovalor-api:local
    ports:
      - "${AUTOVALOR_API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AUTOVALOR_DATA_DIR: /app/data
      # MLflow 3 rejects the filesystem backend, so tracking lives in a SQLite file.
      AUTOVALOR_MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
    volumes:
      # Read-only: the API consumes the gold layer, it never writes to the lake.
      - ./data:/app/data:ro
      - ./mlflow.db:/app/mlflow.db:ro
      - ./mlartifacts:/app/mlartifacts:ro
    restart: unless-stopped

  # Optional MLflow UI, reusing the API image (mlflow is a runtime dependency).
  # Start with: docker compose --profile ml up -d mlflow
  mlflow:
    profiles: ["ml"]
    image: autovalor-api:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - mlflow
      - ui
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    restart: unless-stopped
