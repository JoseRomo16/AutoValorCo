<!doctype html>
<!-- Trimmed copy of a real TuCarro search page (cars), kept small on purpose.
     Card 1: official store, new car. Card 2: private seller, used car.
     Card 3: broken card with no link, which the parser must skip. -->
<html lang="es">
  <body>
    <section class="ui-search-results">
      <ol class="ui-search-layout ui-search-layout--grid">
        <li class="ui-search-layout__item">
          <div class="ui-search-result__wrapper">
            <div class="andes-card poly-card poly-card--grid-card poly-card--MOT">
              <div class="poly-card__content">
                <h3 class="poly-component__title-wrapper">
                  <a class="poly-component__title"
                     href="https://articulo.tucarro.com.co/MCO-1686772601-hb20-premium-modelo-2026-_JM#polycard_client=search-desktop&amp;position=1"
                     target="_blank">Hyundai Hb20 2026 1.6 Advance Aut</a>
                </h3>
                <span class="poly-component__seller">
                  Autama Hyundai
                  <svg aria-label="Tienda oficial" class="polylabel-icon" role="img" viewbox="0 0 14 14">
                    <use href="#poly_cockade"></use>
                  </svg>
                </span>
                <div class="poly-component__price">
                  <div class="poly-price__current">
                    <span aria-label="78990000 pesos colombianos" aria-roledescription="Monto"
                          class="andes-money-amount poly-price__amount" role="img">
                      <span aria-hidden="true" class="andes-money-amount__currency">
                        <span class="andes-money-amount__currency-symbol">$</span>
                      </span>
                      <span aria-hidden="true" class="andes-money-amount__fraction">78.990.000</span>
                    </span>
                  </div>
                </div>
                <div class="poly-component__attributes-list">
                  <ul class="poly-attributes_list">
                    <li class="poly-attributes_list__item poly-attributes_list__separator">2026</li>
                    <li class="poly-attributes_list__item poly-attributes_list__separator">0 Km</li>
                  </ul>
                </div>
                <span class="poly-component__location">Armenia - Quindio</span>
              </div>
            </div>
          </div>
        </li>

        <li class="ui-search-layout__item">
          <div class="ui-search-result__wrapper">
            <div class="andes-card poly-card poly-card--grid-card poly-card--MOT">
              <div class="poly-card__content">
                <h3 class="poly-component__title-wrapper">
                  <a class="poly-component__title"
                     href="https://articulo.tucarro.com.co/MCO-4430904096-nissan-sentra-18-b15-_JM#polycard_client=search-desktop&amp;position=5"
                     target="_blank">Nissan Sentra 1.8 B15</a>
                </h3>
                <div class="poly-component__price">
                  <div class="poly-price__current">
                    <span aria-label="25000000 pesos colombianos" class="andes-money-amount poly-price__amount" role="img">
                      <span aria-hidden="true" class="andes-money-amount__currency">
                        <span class="andes-money-amount__currency-symbol">$</span>
                      </span>
                      <span aria-hidden="true" class="andes-money-amount__fraction">25.000.000</span>
                    </span>
                  </div>
                </div>
                <div class="poly-component__attributes-list">
                  <ul class="poly-attributes_list">
                    <li class="poly-attributes_list__item poly-attributes_list__separator">2006</li>
                    <li class="poly-attributes_list__item poly-attributes_list__separator">138.000 Km</li>
                    <li class="poly-attributes_list__item poly-attributes_list__separator">Mecánica</li>
                  </ul>
                </div>
                <span class="poly-component__location">Chapinero - Bogotá D.C.</span>
              </div>
            </div>
          </div>
        </li>

        <li class="ui-search-layout__item">
          <div class="ui-search-result__wrapper">
            <div class="andes-card poly-card poly-card--grid-card">
              <div class="poly-card__content">
                <h3 class="poly-component__title-wrapper">
                  <span class="poly-component__title">Anuncio sin enlace</span>
                </h3>
              </div>
            </div>
          </div>
        </li>
      </ol>
    </section>
  </body>
</html>
