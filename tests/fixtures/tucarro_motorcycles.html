<!doctype html>
<!-- Trimmed copy of a real TuCarro search page (motorcycles). -->
<html lang="es">
  <body>
    <section class="ui-search-results">
      <ol class="ui-search-layout ui-search-layout--grid">
        <li class="ui-search-layout__item">
          <div class="ui-search-result__wrapper">
            <div class="andes-card poly-card poly-card--grid-card poly-card--MOT">
              <div class="poly-card__content">
                <h3 class="poly-component__title-wrapper">
                  <a class="poly-component__title"
                     href="https://articulo.tucarro.com.co/MCO-2084746289-bmw-r-1200-gs-2016-k50-_JM#polycard_client=search-desktop"
                     target="_blank">Bmw R 1200 Gs 2016 K50</a>
                </h3>
                <div class="poly-component__price">
                  <div class="poly-price__current">
                    <span aria-label="57000000 pesos colombianos" class="andes-money-amount poly-price__amount" role="img">
                      <span aria-hidden="true" class="andes-money-amount__currency">
                        <span class="andes-money-amount__currency-symbol">$</span>
                      </span>
                      <span aria-hidden="true" class="andes-money-amount__fraction">57.000.000</span>
                    </span>
                  </div>
                </div>
                <div class="poly-component__attributes-list">
                  <ul class="poly-attributes_list">
                    <li class="poly-attributes_list__item poly-attributes_list__separator">2016</li>
                    <li class="poly-attributes_list__item poly-attributes_list__separator">78.000 Km</li>
                  </ul>
                </div>
                <span class="poly-component__location">Armenia - Quindio</span>
              </div>
            </div>
          </div>
        </li>

        <li class="ui-search-layout__item">
          <div class="ui-search-result__wrapper">
            <div class="andes-card poly-card poly-card--grid-card poly-card--MOT">
              <div class="poly-card__content">
                <h3 class="poly-component__title-wrapper">
                  <a class="poly-component__title"
                     href="https://articulo.tucarro.com.co/MCO-4336714534-honda-xre-300-con-accesorios-_JM"
                     target="_blank">Honda Xre 300 Con Accesorios</a>
                </h3>
                <div class="poly-component__price">
                  <div class="poly-price__current">
                    <span aria-label="31500000 pesos colombianos" class="andes-money-amount poly-price__amount" role="img">
                      <span aria-hidden="true" class="andes-money-amount__currency">
                        <span class="andes-money-amount__currency-symbol">$</span>
                      </span>
                      <span aria-hidden="true" class="andes-money-amount__fraction">31.500.000</span>
                    </span>
                  </div>
                </div>
                <div class="poly-component__attributes-list">
                  <ul class="poly-attributes_list">
                    <li class="poly-attributes_list__item poly-attributes_list__separator">2023</li>
                    <li class="poly-attributes_list__item poly-attributes_list__separator">24.500 Km</li>
                  </ul>
                </div>
                <span class="poly-component__location">Medellín - Antioquia</span>
              </div>
            </div>
          </div>
        </li>
      </ol>
    </section>
  </body>
</html>
