# Render blueprint for the AutoValor CO API.
#
# One free web service, nothing else. No database, no disk, no background worker: the
# served model is inside the image and the result tables are files, so there is nothing
# for this service to persist. That is what keeps it on a plan that never asks for a card.
#
# Render reads this file when you connect the repository as a Blueprint. The deployment
# steps you have to do by hand are in docs/deploy-render.md.
services:
  - type: web
    name: autovalor-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    region: oregon
    # The branch Render redeploys from. Change it here rather than in the dashboard, so
    # the repository stays the source of truth.
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Origins allowed to call the API from a browser, comma-separated. The first entry
      # is the static site declared below; the localhost entry stays so the app can be
      # developed against the deployed API. Both this form and a JSON array parse — see
      # Settings._parse_origins.
      - key: AUTOVALOR_CORS_ALLOW_ORIGINS
        value: https://autovalor-web.onrender.com,http://localhost:3000
      - key: AUTOVALOR_LOG_LEVEL
        value: INFO
      # Which port Render routes traffic to. It is PORT and not AUTOVALOR_API_PORT because
      # nothing in the image reads the latter: the Dockerfile's CMD passes --port 8000 to
      # uvicorn literally, and AUTOVALOR_API_PORT only ever fed `make serve`. Setting PORT
      # to the same 8000 is what tells the platform where to probe instead of guessing.
      - key: PORT
        value: "8000"
