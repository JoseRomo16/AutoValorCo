# Render blueprint for AutoValor CO.
#
# Two free services and nothing else. No database, no disk, no background worker: the
# served model is inside the image and the result tables are files, so there is nothing
# for either service to persist. That is what keeps this on plans that never ask for a card.
#
#   autovalor-api  a Docker web service, the FastAPI app
#   autovalor-web  a static site, the Next.js export that calls it
#
# Render reads this file when you connect the repository as a Blueprint. The deployment
# steps you have to do by hand are in docs/deploy-render.md.
services:
  - type: web
    name: autovalor-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    region: oregon
    # The branch Render redeploys from. Change it here rather than in the dashboard, so
    # the repository stays the source of truth.
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Origins allowed to call the API from a browser, comma-separated. The first entry
      # is the static site declared below; the localhost entry stays so the app can be
      # developed against the deployed API. Both this form and a JSON array parse — see
      # Settings._parse_origins.
      - key: AUTOVALOR_CORS_ALLOW_ORIGINS
        value: https://autovalor-web.onrender.com,http://localhost:3000
      - key: AUTOVALOR_LOG_LEVEL
        value: INFO
      # Which port Render routes traffic to. The Dockerfile's CMD passes --port 8000 to
      # uvicorn, so PORT tells the platform where to probe instead of guessing.
      - key: PORT
        value: "8000"
  # The front end: a static export, so it is free and there is no server to keep awake.
  # Static sites take no `plan` (they have no compute plan) and no `rootDir`: with a root
  # directory Render hides every file outside it at build time, and the build reads
  # docs/results and artifacts/models from the repository root. So the build runs from the
  # root, steps into frontend/, and the publish path is relative to the root.
  - type: web
    name: autovalor-web
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/out
    autoDeploy: true
    envVars:
      # Baked into the bundle at build time by Next, so it is a build input and not a
      # runtime setting: changing it requires a redeploy, which is what `autoDeploy` does.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://autovalor-api.onrender.com
