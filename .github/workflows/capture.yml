---
name: Weekly capture

on:
  schedule:
    # Mondays 07:00 UTC = 02:00 in Colombia, when the site is quiet.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      pages:
        description: Search pages per location and vertical
        required: false
        default: "10"
      locations:
        description: Space-separated location slugs
        required: false
        default: >-
          bogota-dc antioquia valle-del-cauca atlantico santander cundinamarca
      dry_run:
        description: >-
          Capture but write nothing: no bronze, no publish to the data branch. For
          exercising the workflow itself — the wall detection, the summary, the issue —
          without putting a partial sweep into an append-only history.
        required: false
        type: boolean
        default: false

concurrency:
  # Never let two captures hit the site at the same time.
  group: capture
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  PAGES: ${{ inputs.pages || '10' }}
  LOCATIONS: >-
    ${{ inputs.locations ||
    'bogota-dc antioquia valle-del-cauca atlantico santander cundinamarca' }}
  DRY_RUN: ${{ inputs.dry_run || false }}
  # Marks the single issue that tracks the wall, so a blocked week finds the one from
  # last week instead of opening another.
  BLOCKED_LABEL: capture-blocked
  BLOCKED_TITLE: Captura bloqueada por verificación

jobs:
  capture:
    name: capture and transform
    # Pinned rather than ubuntu-latest: that label is migrating to Ubuntu 26, and a
    # scraper is the worst place to discover an image change by surprise.
    runs-on: ubuntu-24.04
    permissions:
      # The capture publishes its bronze files to the data branch (ADR 0004).
      contents: write
      # A blocked capture is a green run by design, so something has to raise a hand:
      # the job opens, updates and closes an issue tracking the wall.
      issues: write
    # Polite scraping means randomized pauses between requests, so a full sweep
    # takes a while by design.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version because astral-sh stopped publishing floating
        # major tags after v7: there is no `v10` to follow.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Exit code 3 means TuCarro asked for verification (ingest.cli.BLOCKED_EXIT_CODE).
      # That is not a failure to fix, so the job does not go red for it: it records the
      # state, skips the rest of the pipeline and stops. Every other code behaves as
      # before, including the 1 of a capture that lost one location but wrote bronze.
      - name: Capture listings into bronze
        id: capture
        run: |
          args=()
          for slug in $LOCATIONS; do
            args+=(--location "$slug")
          done
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          set +e
          uv run python -m autovalor.ingest.cli \
            --vehicle-type all \
            --pages "$PAGES" \
            "${args[@]}"
          code=$?
          set -e

          # data/ is gitignored, so a fresh checkout has no lake: anything under
          # bronze/ now was written by this run.
          if find data/bronze -name '*.parquet' -print -quit 2>/dev/null | grep -q .; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$code" -eq 3 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Captura bloqueada por verificación"
              echo
              echo "TuCarro pidió verificación de cuenta, así que la captura se detuvo"
              echo "sin reintentos y sin pedir más páginas. No hay nada que arreglar en"
              echo "el código: el sitio dijo que no."
              echo
              echo "No se corrieron la validación, dbt ni la publicación."
              echo "La fuente de datos se decide en el ADR"
              echo "\`docs/adr/0005-capture-source-after-verification-wall.md\`."
              echo
              echo "Queda un issue abierto con el detalle, porque un run verde no avisa."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Captura bloqueada::TuCarro pidió verificación; captura detenida sin reintentos"
            exit 0
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          exit "$code"

      # The job stays green when the wall is up, which is correct — nothing is broken —
      # but a green run notifies nobody. One issue carries the whole episode: opened the
      # first blocked week, commented on every week after, closed when the capture works
      # again. Not one issue per week, which would be noise rather than a signal.
      - name: Open or update the blocked-capture issue
        if: ${{ steps.capture.outputs.blocked == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today=$(date -u +%Y-%m-%d)
          # Created on first use; it already existing is the normal case, not an error.
          gh label create "$BLOCKED_LABEL" \
            --description "La captura semanal choca con la verificación de TuCarro" \
            --color D93F0B 2>/dev/null || true

          existing=$(gh issue list --label "$BLOCKED_LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          # Bodies go through a file: a here-document is the only way to keep Markdown
          # out of YAML's and the shell's quoting rules at the same time.
          if [ -n "$existing" ]; then
            cat > comment.md <<EOF
          Sigue bloqueada el **$today**.

          - Run: $RUN_URL
          - Costo de esta semana: **una petición**.
          EOF
            gh issue comment "$existing" --body-file comment.md
            echo "::notice title=Issue actualizado::#$existing"
          else
            cat > issue.md <<EOF
          TuCarro responde \`302\` hacia \`/gz/account-verification\`, así que la captura
          semanal se detiene en la primera petición, sin reintentos, y no escribe bronze.

          - Primera semana bloqueada de este episodio: **$today**
          - Run: $RUN_URL
          - El job queda **verde** a propósito: no hay nada roto en el código, el sitio
            dijo que no. Este issue es el aviso que un run verde no da.
          - Fuente de datos: \`docs/adr/0005-capture-source-after-verification-wall.md\`

          Se comenta cada semana que siga bloqueada, y **se cierra solo** en cuanto una
          captura vuelva a traer anuncios.
          EOF
            gh issue create --title "$BLOCKED_TITLE" \
              --label "$BLOCKED_LABEL" --body-file issue.md
          fi

      # The other half: the wall coming down has to close the issue, or it stays open
      # forever and stops meaning anything. Conditioned on the capture step rather than
      # on the job, so a later dbt or Pandera failure — which says nothing about the
      # wall — neither keeps a stale issue open nor closes one wrongly.
      - name: Close the blocked-capture issue if the capture worked
        if: ${{ !cancelled() && steps.capture.outputs.blocked != 'true' && steps.capture.outputs.captured == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label "$BLOCKED_LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            echo "No hay issue de bloqueo abierto; nada que cerrar."
            exit 0
          fi
          cat > resolved.md <<EOF
          La captura **volvió a funcionar** el $(date -u +%Y-%m-%d): TuCarro sirvió
          páginas de búsqueda y el run escribió bronze.

          - Run: $RUN_URL

          Se cierra solo. Si el muro vuelve, la próxima captura bloqueada abre un issue
          nuevo para ese episodio.
          EOF
          gh issue close "$existing" --comment "$(cat resolved.md)"
          echo "::notice title=Issue cerrado::#$existing"

      - name: Validate bronze
        if: ${{ steps.capture.outputs.blocked != 'true' && steps.capture.outputs.captured == 'true' }}
        run: uv run python -m autovalor.quality.cli --stage bronze

      - name: Build silver and gold
        if: ${{ steps.capture.outputs.blocked != 'true' && steps.capture.outputs.captured == 'true' }}
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Validate silver and gold
        if: ${{ steps.capture.outputs.blocked != 'true' && steps.capture.outputs.captured == 'true' }}
        run: uv run python -m autovalor.quality.cli --stage silver --stage gold

      - name: Report capture size
        if: ${{ steps.capture.outputs.blocked != 'true' && steps.capture.outputs.captured == 'true' }}
        run: |
          uv run python - <<'PY'
          import duckdb

          with duckdb.connect("data/autovalor.duckdb", read_only=True) as con:
              rows = con.sql(
                  "select vehicle_type, count(*) from main_gold.gold_listings group by 1"
              ).fetchall()
          for vehicle_type, count in sorted(rows):
              print(f"{vehicle_type}: {count} model-ready listings")
          PY

      - name: Publish bronze to the data branch
        # Runs even after a failed validation, for the same reason the upload does: the
        # capture itself is the irreplaceable part. Only bronze is published; silver and
        # gold are rebuilt from it with dbt. See docs/adr/0004-capture-history-storage.md.
        #
        # Conditioned on files existing rather than on the exit code: `history push`
        # raises when there is no bronze layer at all, which is exactly the shape of a
        # capture blocked on its first request. A capture blocked *after* some locations
        # did write bronze, and that data is published like any other.
        if: ${{ !cancelled() && steps.capture.outputs.captured == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m autovalor.ingest.history push \
            --message "bronze from run ${{ github.run_id }}"

      - name: Upload capture
        # A capture that loses one department exits non-zero but has already written
        # bronze, and a dbt or Pandera failure leaves bronze untouched. Skipping the
        # upload in those cases threw away the only copy of the data, so this runs
        # whenever the job was not cancelled. Earlier failures still fail the job.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: capture-${{ github.run_id }}
          path: |
            data/bronze
            data/autovalor.duckdb
          retention-days: 90
          # `warn`, not `error`. A blocked capture legitimately has nothing to upload,
          # and on 2026-10-26 this step is what turned that into a red run: the real
          # event was buried under a failure about missing files.
          if-no-files-found: warn
