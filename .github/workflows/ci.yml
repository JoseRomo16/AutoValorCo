---
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov-report=xml

  frontend:
    name: frontend builds and lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # The static export is what Render publishes, so building it here is the same
      # command the platform runs. It also reads docs/results and artifacts/models from
      # the repository, which means a missing or malformed result table fails the build
      # rather than rendering an empty page.
      - name: Build the static export
        run: npm run build

      - name: Check the export produced every page
        run: |
          for page in index.html mercado/index.html metodologia/index.html; do
            test -s "out/$page" || { echo "::error::out/$page is missing or empty"; exit 1; }
          done
          echo "::notice title=Static export::$(du -sh out | cut -f1) in $(find out -name '*.html' | wc -l) pages"

  docker:
    name: api image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Plain docker build on the runner's pre-installed Docker: no third-party
      # actions, nothing to keep pinned, and the image is small enough that a layer
      # cache is not worth the extra moving parts.
      - name: Build the API image
        run: docker build --file Dockerfile.api --tag autovalor-api:ci .

      # The development machine has no Docker, so CI is where the F4 size budget is
      # actually measured. Printed in the summary so the number is visible without
      # opening logs, and failed outright past the ceiling: an image that does not fit
      # the free tier is a broken deployment, not a warning.
      - name: Report and check the image size
        run: |
          bytes=$(docker image inspect autovalor-api:ci --format '{{.Size}}')
          megabytes=$((bytes / 1024 / 1024))
          echo "API image: ${megabytes} MB" >> "$GITHUB_STEP_SUMMARY"
          # Also as a notice annotation, which unlike the job summary is readable from the
          # checks API — the only way to see this number without a token.
          echo "::notice title=API image size::${megabytes} MB"
          if [ "$megabytes" -gt 900 ]; then
            echo "::error::the API image is ${megabytes} MB, over the 900 MB ceiling"
            exit 1
          fi

      # The environment Render will pass, read from the blueprint itself rather than
      # retyped here. A value that breaks Settings used to be discoverable only on the
      # platform, because nothing in the repository ever loaded render.yaml.
      - name: Collect the deployment environment from render.yaml
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          PYTHONPATH=src python3 -m autovalor.deploy --service autovalor-api > render-api.env
          cat render-api.env

      # Proves the image actually serves before anyone deploys it: a build that succeeds
      # and a container that answers are different claims. Started with the deployment's
      # own environment, so a CORS allow-list or a port that the service cannot parse
      # fails here and not after a push to main.
      - name: Start it with the deployment environment and check it answers
        run: |
          docker run --detach --name api --env-file render-api.env \
            --publish 8000:8000 autovalor-api:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          # The container's own log, always. Without it a failure here is a bare curl exit
          # code and the actual Python traceback stays inside a container nobody can reach.
          docker logs api
          curl --silent --fail http://127.0.0.1:8000/health --output health.json
          curl --silent --fail http://127.0.0.1:8000/model-info --output model-info.json
          curl --silent --fail http://127.0.0.1:8000/catalog --output catalog.json
          # "200 and some JSON" is not the claim worth checking: a container that starts
          # without its artifacts answers 200 "degraded" by design, which is exactly the
          # broken deployment this step exists to catch. So assert both models are loaded
          # and both catalogues made it into the image.
          python3 - <<'PY'
          import json, pathlib, sys

          health = json.loads(pathlib.Path("health.json").read_text())
          if health["status"] != "ok" or health["models_loaded"] != ["car", "motorcycle"]:
              sys.exit(f"::error::the container serves no usable model: {health}")

          catalog = json.loads(pathlib.Path("catalog.json").read_text())
          served = {v["vehicle_type"]: v for v in catalog["verticals"]}
          if set(served) != {"car", "motorcycle"}:
              sys.exit(f"::error::/catalog is missing a vertical: {sorted(served)}")
          for name, vertical in served.items():
              if not vertical["brands"] or not vertical["departments"]:
                  sys.exit(f"::error::the {name} catalogue in the image is empty")

          makes = ", ".join(f"{name}: {len(v['brands'])} makes" for name, v in served.items())
          print(f"::notice title=Image serves::{health['models_loaded']} loaded, {makes}")
          PY
          docker stop api
