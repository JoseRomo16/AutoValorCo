---
name: Enrich motorcycle details

# Reads the attribute table of motorcycle listings that do not have one yet, and
# publishes the result to the data branch. Manual: a polite pause of two to six seconds
# per request makes this a job of hours, so it is never on a schedule.
#
# This is a separate workflow from capture.yml on purpose. The enrichment needs two
# things a fresh capture cannot provide: a gold layer covering the whole accumulated lake
# (so the candidates are the listings that are actually missing a detail row) and the
# published detail layer (so a listing is never fetched twice). Both come from
# pull-history, which is why that is the first step here.
#
# Cars are deliberately not an option. They reach the F2 target without a single extra
# request, and the decision not to enrich them is recorded in docs/STATUS.md.

on:
  workflow_dispatch:
    inputs:
      enrich_budget:
        description: >-
          Listing pages to read in this run. Measured at roughly 15 pages a minute, so
          800 is about 55 minutes of scraping. Keep it well inside the job timeout: the
          rows are written once, at the end, so a run killed by the timeout loses
          everything it fetched.
        required: false
        default: "800"
      first_seen_after:
        description: >-
          Only enrich listings first captured on or after this date (YYYY-MM-DD). Leave
          empty to consider every motorcycle without a detail row. The sample is random
          over candidates, so setting this is what makes "catch up what the last capture
          brought" a different job from "resume a pass that was stopped on purpose".
        required: false
        default: ""

concurrency:
  # Shares the group with the weekly capture: never two scrapers on the site at once.
  group: capture
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  ENRICH_BUDGET: ${{ inputs.enrich_budget || '800' }}
  FIRST_SEEN_AFTER: ${{ inputs.first_seen_after }}

jobs:
  enrich:
    name: enrich from the detail pages
    # Pinned rather than ubuntu-latest: that label is migrating to Ubuntu 26, and a
    # scraper is the worst place to discover an image change by surprise.
    runs-on: ubuntu-24.04
    permissions:
      # Publishes the new detail rows to the data branch (ADR 0004).
      contents: write
    # Generous against the budget above, because losing a run to the timeout means
    # losing every page it fetched.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version because astral-sh stopped publishing floating
        # major tags after v7: there is no `v10` to follow.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Bring the published history into the lake
        run: uv run python -m autovalor.ingest.history pull

      - name: Build silver and gold
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      # Logs how many listings are still missing a detail row, which is how you know
      # whether another run is needed.
      #
      # Exit code 3 is the verification wall, handled exactly as in capture.yml: the run
      # does not go red, it records the state and stops. The enrichment reads TuCarro
      # listing pages one by one, so it meets the same wall the capture does.
      - name: Enrich motorcycles from their detail pages
        id: enrich
        run: |
          set +e
          uv run python -m autovalor.ingest.detail_cli \
            --vehicle-type motorcycle \
            --budget "$ENRICH_BUDGET" \
            ${FIRST_SEEN_AFTER:+--since "$FIRST_SEEN_AFTER"}
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Enriquecimiento bloqueado por verificación"
              echo
              echo "TuCarro pidió verificación de cuenta. El run se detuvo en la primera"
              echo "página bloqueada, sin reintentos. Las páginas que sí respondieron"
              echo "antes se publican igual: ya se pidieron."
              echo
              echo "No se corrió la validación del layer de detalle."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Enriquecimiento bloqueado::TuCarro pidió verificación; enriquecimiento detenido sin reintentos"
            exit 0
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Validate the detail layer
        if: ${{ steps.enrich.outputs.blocked != 'true' }}
        run: uv run python -m autovalor.quality.cli --stage detail

      - name: Publish the detail layer to the data branch
        # Runs even after a failed validation, for the same reason the capture upload
        # does: the fetched pages are the irreplaceable part of the run.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m autovalor.ingest.history push \
            --message "detail: enrichment from run ${{ github.run_id }}"
