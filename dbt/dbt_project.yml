---
name: autovalor
version: 0.1.0
config-version: 2
profile: autovalor

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Mirror of the thresholds in src/autovalor/quality/schemas.py.
# tests/quality/test_thresholds.py fails if the two ever drift apart.
vars:
  min_price_cop: 1000000
  max_price_cop: 2000000000
  min_model_year: 1950
  max_mileage_km: 1000000

models:
  autovalor:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
