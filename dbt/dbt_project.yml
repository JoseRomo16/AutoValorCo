---
name: autovalor
version: 0.1.0
config-version: 2
profile: autovalor

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Mirror of the thresholds in src/autovalor/quality/schemas.py.
# tests/quality/test_thresholds.py fails if the two ever drift apart.
vars:
  min_price_cop: 1000000
  max_price_cop: 2000000000
  min_model_year: 1950
  max_mileage_km: 1000000
  # Engine size, used to sanity-check what is mined out of the title.
  min_engine_cc: 50
  max_engine_cc: 2500
  min_car_cc: 600
  max_car_cc: 8000

seeds:
  autovalor:
    +schema: seeds
    vehicle_brands:
      +column_types:
        alias: varchar
        brand: varchar
        applies_to: varchar

models:
  autovalor:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
