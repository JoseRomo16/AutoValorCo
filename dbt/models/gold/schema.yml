---
version: 2

models:
  - name: gold_listings
    description: >
      Model-ready listings: plausible rows only, one row per listing, with the
      derived columns the valuation models consume.
    columns:
      - name: listing_id
        description: Publisher identifier; unique in this table.
        data_tests:
          - not_null
          - unique
      - name: vehicle_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["car", "motorcycle"]
      - name: brand
        description: >
          Canonical make, resolved from the title against the vehicle_brands seed.
          "Desconocida" when no alias matched.
        data_tests:
          - not_null
      - name: model
        description: >
          Canonical model token, mined from the title by scanning it against the
          model_tokens and model_aliases seeds. NULL when every token in the title was
          an ad word, a colour or the make itself.
      - name: engine_cc
        description: >
          Displacement in cc, mined from the title. Cars advertise litres ("1.6"),
          motorcycles advertise cc, sometimes inside the model name ("Xre 300").
          NULL when the title does not carry it.
      - name: is_quad
        description: >
          Quad, buggy or side-by-side listed inside the motorcycle vertical. A
          different market, kept so F2 can segment it out rather than silently
          dropping the rows.
        data_tests:
          - not_null
      - name: is_cargo
        description: >
          Cargo three-wheeler (motocarro, carguero, tricargo) listed inside the
          motorcycle vertical. Same reason as is_quad: a population the model can split
          on instead of rows that quietly widen the band.
        data_tests:
          - not_null
      - name: price_cop
        description: Asking price in Colombian pesos.
        data_tests:
          - not_null
      - name: log_price
        description: Modeling target.
        data_tests:
          - not_null
      - name: model_year
        data_tests:
          - not_null
      - name: vehicle_age_years
        data_tests:
          - not_null
      - name: mileage_km
        data_tests:
          - not_null
      - name: km_per_year
        data_tests:
          - not_null
