[project]
name = "autovalor"
version = "0.1.0"
description = "Used car and motorcycle price valuation for the Colombian market"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["colombia", "used-vehicles", "price-prediction", "hedonic-model"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    # Data ingestion
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
    "tenacity>=9.0",
    # Storage and transformation
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "pandera>=0.20",
    # Modeling
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "optuna>=4.0",
    "shap>=0.46",
    "mlflow>=2.17",
    # API and configuration
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/joseluis/autovalor-co"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autovalor"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks", "frontend", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "PTH",  # flake8-use-pathlib
    "T20",  # flake8-print
    "RUF",  # ruff-specific rules
]
ignore = [
    "ANN401", # dynamically typed *args/**kwargs are sometimes unavoidable
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "dbt.*",
    "duckdb.*",
    "lightgbm.*",
    "mlflow.*",
    "optuna.*",
    "pandera.*",
    "shap.*",
    "sklearn.*",
    "statsmodels.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=autovalor",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
