[project]
name = "autovalor"
version = "0.1.0"
description = "Used car and motorcycle price valuation for the Colombian market"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["colombia", "used-vehicles", "price-prediction", "hedonic-model"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
# What the *API* needs, and nothing else. This list is the F4 budget: Render's free tier
# gives 512 MB, and MLflow, CatBoost, Playwright, dbt and shap together are most of a
# gigabyte before any code is written. Everything else moved into the groups below, which
# `uv sync` still installs by default (see [tool.uv]) so dev and CI are unchanged — the
# Docker build is the only thing that asks for this list alone.
#
# LightGBM and pandas are here because predicting needs them. shap is *not*: SHAP values
# come from LightGBM's own `pred_contrib`, which is the same TreeSHAP algorithm, pinned
# against the shap package in tests/models/test_explain.py.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/JoseRomo16/AutoValorCo"

[dependency-groups]
# Capture and the polite HTTP client.
ingest = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
    "tenacity>=9.0",
    "truststore>=0.10",
]
# The lake: dbt, DuckDB, Parquet and the Pandera contracts.
transform = [
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "pandera>=0.20",
]
# Training and tuning, plus the experiment tracking that only `make train` uses.
train = [
    "scikit-learn>=1.5",
    "catboost>=1.2.7",
    "optuna>=4.0",
    "shap>=0.46",
    "mlflow>=2.17",
]
# F3's econometrics and its static figures.
analysis = [
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
]

[tool.uv]
# A bare `uv sync` installs everything, so a developer and CI see no change from the split.
# The image asks for the runtime list alone with `uv sync --no-default-groups`.
default-groups = ["ingest", "transform", "train", "analysis", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autovalor"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks", "frontend", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "PTH",  # flake8-use-pathlib
    "T20",  # flake8-print
    "RUF",  # ruff-specific rules
]
ignore = [
    "ANN401", # dynamically typed *args/**kwargs are sometimes unavoidable
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "dbt.*",
    "duckdb.*",
    "lightgbm.*",
    "matplotlib.*",
    "mlflow.*",
    "optuna.*",
    "pandera.*",
    "shap.*",
    "sklearn.*",
    "statsmodels.*",
    "yaml.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=autovalor",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
