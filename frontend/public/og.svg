<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AutoValor CO">
  <rect width="1200" height="630" fill="#14130f"/>
  <rect x="0" y="0" width="1200" height="6" fill="#f6c800"/>

  <!-- The mark: the word, then "CO" set as a Colombian private plate. -->
  <g transform="translate(96 120)">
    <text font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="800" fill="#f2efe6" letter-spacing="-1">AutoValor</text>
    <g transform="translate(252 -32)">
      <rect width="58" height="42" rx="5" fill="#f6c800" stroke="#14130f" stroke-width="3"/>
      <rect x="-2" y="-2" width="62" height="46" rx="7" fill="none" stroke="#f6c800" stroke-width="3"/>
      <text x="29" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#14130f">CO</text>
    </g>
  </g>

  <text x="96" y="272" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="800" fill="#f2efe6" letter-spacing="-2">Cuánto vale tu carro</text>
  <text x="96" y="362" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="800" fill="#f2efe6" letter-spacing="-2">o tu moto usada</text>

  <text x="96" y="432" font-family="Segoe UI, Helvetica, sans-serif" font-size="30" fill="#a39e8f">Precio estimado, rango probable y qué lo mueve.</text>

  <!-- The band, which is the thing this product has that a plain estimator does not. -->
  <g transform="translate(96 492)">
    <rect width="1008" height="34" rx="4" fill="#2b2923"/>
    <rect x="212" y="9" width="560" height="16" rx="2" fill="#45423a"/>
    <rect x="474" y="3" width="3" height="28" fill="#f2efe6"/>
    <rect x="556" y="-3" width="5" height="40" rx="2" fill="#f6c800"/>
    <text x="212" y="66" font-family="Consolas, monospace" font-size="20" fill="#8a8577">P10</text>
    <text x="772" y="66" text-anchor="end" font-family="Consolas, monospace" font-size="20" fill="#8a8577">P90</text>
  </g>
</svg>
